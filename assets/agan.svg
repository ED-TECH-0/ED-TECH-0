<style>.s{font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}.mu{fill:#8e939c}.tx{fill:#f4f5f7}.si{fill:#c7cad0}.nd{animation:gw 9s infinite}@keyframes gw{0%,14%,100%{fill-opacity:.05;stroke-opacity:.22}4%,9%{fill-opacity:.28;stroke-opacity:.95}}.bar{transform-box:fill-box;transform-origin:bottom;animation:gr 1.2s cubic-bezier(.22,1,.36,1) both}@keyframes gr{from{transform:scaleY(0)}}.tt{font-size:46px;font-weight:700;fill:url(#ch)}</style>
<g clip-path="url(#cp)"><rect width="1200" height="340" fill="#000"/><rect width="1200" height="340" fill="url(#rg)"/><rect x="40" y="38" width="520" height="264" rx="20" fill="url(#gl)" stroke="url(#bd)"/><text class="s si" x="68" y="76" font-size="12" letter-spacing=".5">PLANNING AND SCAFFOLDING  ·  OPEN SOURCE</text><text class="s tt" x="66" y="128">agan</text><text class="s tx" x="68" y="164" font-size="18">One common intelligence for every maker,</text><text class="s tx" x="68" y="188" font-size="18">on every machine.</text><text class="s mu" x="68" y="224" font-size="14">Knowledge from the internet, skills in a small local model.</text><text class="s mu" x="68" y="246" font-size="14">Scales from a 4 GB laptop to a workstation GPU.</text><text class="m si" x="68" y="282" font-size="12">Retrieval-first · Privacy firewall · Verifies by running</text><rect x="590" y="38" width="570" height="264" rx="20" fill="url(#gl)" stroke="url(#bd)"/><text class="s mu" x="614" y="68" font-size="13">Pipeline</text><rect class="nd" style="animation-delay:0.0s" x="610" y="84" width="126" height="34" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".22"/><text class="s tx" x="673.0" y="106" font-size="12" text-anchor="middle">Router</text><line x1="736" y1="101" x2="750" y2="101" stroke="#fff" stroke-opacity=".3"/><rect class="nd" style="animation-delay:0.8s" x="750" y="84" width="126" height="34" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".22"/><text class="s tx" x="813.0" y="106" font-size="12" text-anchor="middle">Planner</text><line x1="876" y1="101" x2="890" y2="101" stroke="#fff" stroke-opacity=".3"/><rect class="nd" style="animation-delay:1.6s" x="890" y="84" width="126" height="34" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".22"/><text class="s tx" x="953.0" y="106" font-size="12" text-anchor="middle">Privacy Firewall</text><line x1="1016" y1="101" x2="1030" y2="101" stroke="#fff" stroke-opacity=".3"/><rect class="nd" style="animation-delay:2.4s" x="1030" y="84" width="126" height="34" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".22"/><text class="s tx" x="1093.0" y="106" font-size="12" text-anchor="middle">Retriever</text><rect class="nd" style="animation-delay:3.2s" x="610" y="132" width="98" height="34" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".22"/><text class="s tx" x="659.0" y="154" font-size="12" text-anchor="middle">Sanitizer</text><line x1="708" y1="149" x2="722" y2="149" stroke="#fff" stroke-opacity=".3"/><rect class="nd" style="animation-delay:4.0s" x="722" y="132" width="98" height="34" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".22"/><text class="s tx" x="771.0" y="154" font-size="12" text-anchor="middle">Reranker</text><line x1="820" y1="149" x2="834" y2="149" stroke="#fff" stroke-opacity=".3"/><rect class="nd" style="animation-delay:4.8s" x="834" y="132" width="98" height="34" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".22"/><text class="s tx" x="883.0" y="154" font-size="12" text-anchor="middle">Reasoner</text><line x1="932" y1="149" x2="946" y2="149" stroke="#fff" stroke-opacity=".3"/><rect class="nd" style="animation-delay:5.6s" x="946" y="132" width="98" height="34" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".22"/><text class="s tx" x="995.0" y="154" font-size="12" text-anchor="middle">Verifier</text><line x1="1044" y1="149" x2="1058" y2="149" stroke="#fff" stroke-opacity=".3"/><rect class="nd" style="animation-delay:6.4s" x="1058" y="132" width="98" height="34" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".22"/><text class="s tx" x="1107.0" y="154" font-size="12" text-anchor="middle">Writer</text><text class="s mu" x="614" y="196" font-size="13">Profiles, same skills on every size</text><rect class="bar" style="animation-delay:0.00s" x="614" y="248" width="84" height="22" rx="8" fill="#fff" 