<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="What I can do">
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".26"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".025"/></linearGradient>
<linearGradient id="ch" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#fff"/><stop offset=".28" stop-color="#a3a7af"/><stop offset=".5" stop-color="#f6f7f9"/><stop offset=".74" stop-color="#6f737c"/><stop offset="1" stop-color="#e4e6ea"/><animateTransform attributeName="gradientTransform" type="translate" values="-.7 0;.7 0;-.7 0" dur="9s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="rg" cx=".7" cy=".25" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<clipPath id="cp"><rect width="1200" height="370" rx="26"/></clipPath>
</defs>
<style>.s{font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}.mu{fill:#8e939c}.tx{fill:#f4f5f7}.si{fill:#c7cad0}.t{opacity:0;animation:in .9s cubic-bezier(.22,1,.36,1) forwards}@keyframes in{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:none}}.dt{animation:pu 3s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}</style>
<g clip-path="url(#cp)"><rect width="1200" height="370" fill="#000"/><rect width="1200" height="370" fill="url(#rg)"/><g class="t" style="animation-delay:0.00s"><rect x="40" y="40" width="360" height="146" rx="20" fill="url(#gl)" stroke="url(#bd)"/><rect x="41" y="41" width="358" height="1" fill="#fff" fill-opacity=".25"/><circle class="dt" cx="68" cy="74" r="4" fill="#fff"/><text class="s tx" x="84" y="79" font-size="19" font-weight="600">Build operating systems</text><text class="s mu" x="64" y="118" font-size="14">Arch-based distros, ISOs, installers,</text><text class="s mu" x="64" y="138" font-size="14">desktops and system tweak tools.</text><rect x="64" y="148" width="76" height="24" rx="12" fill="none" stroke="#fff" stroke-opacity=".3"/><text class="m tx" x="74" y="165" font-size="11">working</text></g><g class="t" style="animation-delay:0.15s"><rect x="420" y="40" width="360" height="146" rx="20" fill="url(#gl)" stroke="url(#bd)"/><rect x="421" y="41" width="358" height="1" fill="#fff" fill-opacity=".25"/><circle class="dt" cx="448" cy="74" r="4" fill="#fff"/><text class="s tx" x="464" y="79" font-size="19" font-weight="600">Create security tools</text><text class="s mu" x="444" y="118" font-size="14">Pentesting and hardening that start</text><text class="s mu" x="444" y="138" font-size="14">from how attackers think.</text><rect x="444" y="148" width="76" height="24" rx="12" fill="none" stroke="#fff" stroke-opacity=".3"/><text class="m tx" x="454" y="165" font-size="11">working</text></g><g class="t" style="animation-delay:0.30s"><rect x="800" y="40" width="360" height="146" rx="20" fill="url(#gl)" stroke="url(#bd)"/><rect x="801" y="41" width="358" height="1" fill="#fff" fill-opacity=".25"/><circle class="dt" cx="828" cy="74" r="4" fill="#fff"/><text class="s tx" x="844" y="79" font-size="19" font-weight="600">Run AI locally</text><text class="s mu" x="824" y="118" font-size="14">Ollama, GGUF and agents like Hermes</text><text class="s mu" x="824" y="138" font-size="14">and Antigravity. Private, offline.</text><rect x="824" y="148" width="84" height="24" rx="12" fill="none" stroke="#fff" stroke-opacity=".3"/><text class="m tx" x="834" y="165" font-size="11">learning</text></g><g class="t" style="animation-delay:0.30s"><rect x="40" y="206" width="360" height="146" rx="20" fill="url(#gl)" stroke="url(#bd)"/><rect x="41" y="207" width="358" height="1" fill="#fff" fill-opacity=".25"/><circle class="dt" cx="68" cy="240" r="4" fill="#fff"/><text class="s tx" x="84" y="245" font-size="19" font-weight="600">Write low-level code</text><text class="s mu" x="64" y="284" font-size="14">Rust, Python and shell today;</text><text class="s mu" x="64" y="304" font-size="14">assembly and system calls next.</text><rect x="64" y="314" width="76" height="24" rx="12" fill="none" stroke="#fff" stroke-opacity=".3"/><text class="m tx" x="74" y="331" font-size="11">working</text></g><g class="t" style="animation-delay:0.45s"><rect x="420" y="206" width="360" height="146" rx="20" fill="url(#gl)" stroke="url(#bd)"/><rect x="421" y="207" width="358" height="1" fill="#fff" fill-opacity=".25"/><circle class="dt" cx="448" cy="240" r="4" fill="#fff"/><text class="s tx" x="464" y="245" font-size="19" font-weight="600">Design the experience</text><text class="s mu" x="444" y="284" font-size="14">Glass interfaces, design tokens,</text><text class="s mu" x="444" y="304" font-size="14">visual identity, drawing and writing.</text><rect x="444" y="314" width="76" height="24" rx="12" fill="none" stroke="#fff" stroke-opacity=".3"/><text class="m tx" x="454" y="331" font-size="11">working</text></g><g class="t" style="animation-delay:0.60s"><rect x="800" y="206" width="360" height="146" rx="20" fill="url(#gl)" stroke="url(#bd)"/><rect x="801" y="207" width="358" height="1" fill="#fff" fill-opacity=".25"/><circle class="dt" cx="828" cy="240" r="4" fill="#fff"/><text class="s tx" x="844" y="245" font-size="19" font-weight="600">Learn fast, in public</text><text class="s mu" x="824" y="284" font-size="14">I learn by building real things</text><text class="s mu" x="824" y="304" font-size="14">and record what I learn for others.</text></g></g><rect x=".5" y=".5" width="1199" height="369" rx="26" fill="none" stroke="url(#bd)"/></svg>