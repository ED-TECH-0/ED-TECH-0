</defs>
<style>.s{font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}.mu{fill:#8e939c}.tx{fill:#f4f5f7}.si{fill:#c7cad0}.tk{animation:mv 36s linear infinite}@keyframes mv{from{transform:translateX(-1500px)}to{transform:translateX(0)}}</style>
