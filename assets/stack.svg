<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Layered glass stack: Hardware, Kernel, Shell, Desktop, Apps">
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".26"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".025"/></linearGradient>
<linearGradient id="ch" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#fff"/><stop offset=".28" stop-color="#a3a7af"/><stop offset=".5" stop-color="#f6f7f9"/><stop offset=".74" stop-color="#6f737c"/><stop offset="1" stop-color="#e4e6ea"/><animateTransform attributeName="gradientTransform" type="translate" values="-.7 0;.7 0;-.7 0" dur="9s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="rg" cx=".7" cy=".25" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<clipPath id="cp"><rect width="1200" height="440" rx="26"/></clipPath>
</defs>
<style>.s{font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}.mu{fill:#8e939c}.tx{fill:#f4f5f7}.si{fill:#c7cad0}.pl{animation:lift 7s ease-in-out infinite}@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--d)*-1))}}.big{font-size:68px;font-weight:700;fill:url(#ch)}.fl{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}</style>
<g clip-path="url(#cp)"><rect width="1200" height="440" fill="#000"/><rect width="1200" height="440" fill="url(#rg)"/><rect x="40" y="60" width="560" height="320" rx="22" fill="url(#gl)" stroke="url(#bd)"/><text class="s big" x="72" y="150">Vishal V</text><text class="s tx" x="74" y="196" font-size="21">Systems, security and AI engineer.</text><text class="s mu" x="74" y="228" font-size="16">I think in layers, question defaults and learn by building,</text><text class="s mu" x="74" y="250" font-size="16">with agents like Hermes, Antigravity and Ollama beside me.</text><rect x="74" y="288" width="67" height="30" rx="15" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><text class="m si" x="85" y="308" font-size="12">Linux</text><rect x="150" y="288" width="58" height="30" rx="15" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><text class="m si" x="161" y="308" font-size="12">Rust</text><rect x="214" y="288" width="76" height="30" rx="15" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><text class="m si" x="225" y="308" font-size="12">Python</text><rect x="298" y="288" width="76" height="30" rx="15" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><text class="m si" x="309" y="308" font-size="12">Ollama</text><rect x="386" y="288" width="94" height="30" rx="15" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/><text class="m si" x="397" y="308" font-size="12">Security</text><g class="fl"><g class="pl" style="--d:0px"><polygon points="850,272 1000,350 850,428 700,350" fill="url(#gl)" stroke="#fff" stroke-opacity="0.50"/><polygon points="850,298 950,350 850,402 750,350" fill="none" stroke="#fff" stroke-opacity=".12"/><polygon points="850,324 900,350 850,376 800,350" fill="none" stroke="#fff" stroke-opacity=".12"/><text class="s si" x="1012" y="354" font-size="13">Hardware</text></g><g class="pl" style="--d:26px"><polygon points="850,240 1000,318 850,396 700,318" fill="url(#gl)" stroke="#fff" stroke-opacity="0.62"/><polygon points="850,266 950,318 850,370 750,318" fill="none" stroke="#fff" stroke-opacity=".12"/><polygon points="850,292 900,318 850,344 800,318" fill="none" stroke="#fff" stroke-opacity=".12"/><text class="s si" x="1012" y="322" font-size="13">Kernel</text></g><g class="pl" style="--d:52px"><polygon points="850,208 1000,286 850,364 700,286" fill="url(#gl)" stroke="#fff" stroke-opacity="0.74"/><polygon points="850,234 950,286 850,338 750,286" fill="none" stroke="#fff" stroke-opacity=".12"/><polygon points="850,260 900,286 850,312 800,286" fill="none" stroke="#fff" stroke-opacity=".12"/><text class="s si" x="1012" y="290" font-size="13">Shell</text></g><g class="pl" style="--d:78px"><polygon points="850,176 1000,254 850,332 700,254" fill="url(#gl)" stroke="#fff" stroke-opacity="0.86"/><polygon points="850,202 950,254 850,306 750,254" fill="none" stroke="#fff" stroke-opacity=".12"/><polygon points="850,228 900,254 850,280 800,254" fill="none" stroke="#fff" stroke-opacity=".12"/><text class="s si" x="1012" y="258" font-size="13">Desktop</text></g><g class="pl" style="--d:104px"><polygon points="850,144 1000,222 850,300 700,222" fill="url(#gl)" stroke="#fff" stroke-opacity="0.98"/><polygon points="850,170 950,222 850,274 750,222" fill="none" stroke="#fff" stroke-opacity=".12"/><polygon points="850,196 900,222 850,248 800,222" fill="none" stroke="#fff" stroke-opacity=".12"/><text class="s si" x="1012" y="226" font-size="13">Apps</text></g></g></g><rect x=".5" y=".5" width="1199" height="439" rx="26" fill="none" stroke="url(#bd)"/></svg>