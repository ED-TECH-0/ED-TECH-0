<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Sydra OS — A professional glass desktop for people who build things and play games">
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/></linearGradient>
<radialGradient id="gl" cx=".25" cy=".2" r=".9"><stop offset="0" stop-color="#6d5ce8" stop-opacity=".35"/><stop offset="1" stop-color="#07080c" stop-opacity="0"/></radialGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
</defs>
<style>
.s{font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
.t{font-size:44px;font-weight:700;fill:url(#ac);letter-spacing:.02em}
.q{font-size:18px;fill:#eceef4}.d{font-size:14px;fill:#9aa0b4}
.b{font-size:12px;fill:#a99cff;letter-spacing:.06em}
.tg{font-size:12px;fill:#9aa0b4}
.l{opacity:0;animation:ty 12s infinite;font-size:14px;fill:#eceef4}
.c{fill:#8b8fb5}.p{fill:#8b7bff}
@keyframes ty{0%{opacity:0;transform:translateX(-6px)}4%{opacity:1;transform:none}90%{opacity:1}96%,100%{opacity:0}}
.l1{animation-delay:.3s}.l2{animation-delay:1.3s}.l3{animation-delay:2.3s}.l4{animation-delay:3.3s}.l5{animation-delay:4.3s}.l6{animation-delay:5.3s}
.cur{animation:bl 1s steps(1) infinite;fill:#2dd4bf}@keyframes bl{50%{opacity:0}}
</style>
<rect width="1200" height="340" rx="26" fill="#07080c"/><rect width="1200" height="340" rx="26" fill="url(#gl)"/>
<rect x="40" y="38" width="640" height="264" rx="20" fill="#ffffff" fill-opacity=".045" stroke="url(#bd)"/>
<text class="s b" x="68" y="76">IN DEVELOPMENT  ·  ARCH-BASED  ·  GPL-3.0-OR-LATER</text>
<text class="s t" x="66" y="128">Sydra OS</text>
<text class="s q" x="68" y="164">A professional glass desktop for people</text>
<text class="s q" x="68" y="190">who build things and play games.</text>
<text class="s d" x="68" y="226">KDE Plasma 6 on Wayland · Calamares installer · gaming stack</text>
<text class="s d" x="68" y="248">with automatic GPU detection · zero-friction dev workstation</text>
<text class="m tg" x="68" y="282">Arch Linux · KDE Plasma 6 · Wayland · archiso · Calamares · Btrfs</text>
<rect x="716" y="38" width="444" height="264" rx="20" fill="#000" fill-opacity=".45" stroke="url(#bd)"/>
<circle cx="742" cy="64" r="6" fill="#ff5f57"/><circle cx="762" cy="64" r="6" fill="#febc2e"/><circle cx="782" cy="64" r="6" fill="#28c840"/>
<g class="m">
<text class="l l1" x="742" y="110"><tspan class="p">$ </tspan>make check</text>
<text class="l l2" x="742" y="146"><tspan class="p">$ </tspan>make packages</text>
<text class="l l3" x="742" y="182"><tspan class="p">$ </tspan>make repo</text>
<text class="l l4" x="742" y="218"><tspan class="p">$ </tspan>make iso</text>
<text class="l l5" x="742" y="254"><tspan class="p">$ </tspan>make qemu-uefi</text>
<text class="l l6" x="742" y="286"><tspan class="c"># boot, test, repeat</tspan><tspan class="cur"> ▍</tspan></text>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="26" fill="none" stroke="url(#bd)"/>
</svg>
